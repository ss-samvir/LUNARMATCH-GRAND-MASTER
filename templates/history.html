{% extends "base.html" %}

{% block content %}
<section class="page-section history-page">
    <div class="section-kicker">PERSONAL WORKSPACE</div>

    <h1>Analysis History</h1>

    <p class="section-intro">
        Review your previous correspondence analyses and reopen saved reports.
    </p>

    <div id="history-status" class="history-status">
        Loading saved analyses...
    </div>

    <div id="history-list" class="history-list"></div>
</section>

<script>
(async function () {
    const status = document.getElementById("history-status");
    const list = document.getElementById("history-list");

    try {
        const response = await fetch("/api/history", {
            credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Unable to load history.");
        }

        if (!Array.isArray(data) || data.length === 0) {
            status.textContent = "No saved analyses yet.";
            return;
        }

        status.textContent = `${data.length} saved analysis${data.length === 1 ? "" : "es"}`;

        list.innerHTML = data.map(item => `
            <article class="history-card">
                <div class="history-card-top">
                    <div>
                        <span class="history-label">ANALYSIS</span>
                        <h2>${item.headline || "Analysis Complete"}</h2>
                    </div>

                    <div class="history-confidence">
                        ${item.confidence || "UNKNOWN"}
                    </div>
                </div>

                <div class="history-meta">
                    <span>Score: ${Number(item.score || 0).toFixed(2)}%</span>
                    <span>Verified: ${item.verified_matches ?? 0}</span>
                    <span>${item.created_at || ""}</span>
                </div>

                <a
                    class="history-open"
                    href="/api/history/${encodeURIComponent(item.analysis_id)}"
                    target="_blank"
                    rel="noopener"
                >
                    OPEN SAVED ANALYSIS
                </a>
            </article>
        `).join("");

    } catch (error) {
        status.textContent = error.message || "Unable to load history.";
    }
})();
</script>
{% endblock %}
