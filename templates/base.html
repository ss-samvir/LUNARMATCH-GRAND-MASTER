<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LUNARMATCH{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='app.css') }}">
</head>

<body>

    <!-- LIVE SPACE ENVIRONMENT -->
    <div id="space-environment">

        <div class="nebula nebula-one"></div>
        <div class="nebula nebula-two"></div>

        <div class="stars stars-back"></div>
        <div class="stars stars-mid"></div>
        <div class="stars stars-front"></div>

        <div class="space-glow"></div>

    </div>


    <!-- CURSOR LIGHT -->
    <div id="cursor-glow"></div>


    <!-- MAIN WEBSITE -->
    <main id="page-content">
        {% block content %}
        {% endblock %}
    </main>


    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
